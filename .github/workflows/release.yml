# dsh-echo-memory 自动构建 / 发布
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.1.0）→ 构建 + 测试 + 打包，并把 tgz 上传为 GitHub Release 附件；
#   2. 手动 workflow_dispatch → 只构建并上传构建产物 artifact（不发布 Release）。
#
# 产物形态：dsh-echo-memory-<version>.tgz（pnpm pack，按 package.json 的 files 字段：
# lib/ + cordis.patch.yml + README.md），用户下载后经 `dsh plugin add <tgz>` 安装。
# 构建两段式（tsc → lib/types/，tsdown → lib/index.js + lib/client.js）由
# `pnpm run build` 完成，与本地开发完全一致。

name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(tag!==p.version){ console.error('tag v' + tag + ' does not match package.json version ' + p.version); process.exit(1) } console.log('tag == package.json version:', tag)"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict)
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build (tsc + tsdown)
        run: pnpm run build

      - name: Package tarball
        run: pnpm pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-echo-memory-tgz
          path: dsh-echo-memory-*.tgz

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "## 更新记录"
            echo ""
            PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            RANGE="${PREV:+$PREV..}HEAD"
            git log --reverse --format='- %s' "$RANGE"
            echo ""
            if [ -n "$PREV" ]; then
              echo "**完整对比**: https://github.com/${{ github.repository }}/compare/$PREV...${{ github.ref_name }}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-echo-memory-*.tgz
          body_path: release-notes.md